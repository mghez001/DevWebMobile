[from-internal]
exten => 100,1,Answer()
same => n,Wait(1)
same => n,Playback(hello-world)
same => n,Echo()
same => n,Hangup()

exten => _[45]XX,1,NoOp(Appel de ${CALLERID(num)} vers ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},10)
 same => n,NoOp(Résultat du Dial : ${DIALSTATUS})
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?fin)
 same => n,GotoIf($["${DIALSTATUS}" = "CANCEL"]?fin)
 same => n,VoiceMail(${EXTEN}@default,u)
 same => n(fin),Hangup()

exten => _XXX,1,Dial(PJSIP/${EXTEN})
same => n,Hangup()

; ===== Tests du gestionnaire d appels =====
; 8400 : appelle l appli (400) en numero MASQUE
exten => 8400,1,Set(CALLERID(num)=anonymous)
 same => n,Set(CALLERID(name)=Anonymous)
 same => n,Dial(PJSIP/400)
 same => n,Hangup()

; 9400 : appelle l appli depuis un numero de DEMARCHAGE
exten => 9400,1,Set(CALLERID(num)=0162123456)
 same => n,Dial(PJSIP/400)
 same => n,Hangup()

; Annonce pour les numeros masques (= annonceMasque du moteur)
exten => annonce-masque,1,Answer()
 same => n,Wait(1)
 same => n,Playback(custom/annonce-masque)
 same => n,Hangup()

; *77 : enregistrer l annonce des numeros masques (bip, parler, puis # ou 3 s de silence)
exten => *77,1,Answer()
 same => n,Wait(1)
 same => n,Record(custom/annonce-masque.wav,3,30,k)
 same => n,Wait(1)
 same => n,Playback(custom/annonce-masque)
 same => n,Hangup()

; ===== Messages SIP (MESSAGE) entre extensions =====
[messages]
exten => _[345]XX,1,NoOp(Message de ${MESSAGE(from)} vers ${EXTEN} : ${MESSAGE(body)})
 same => n,MessageSend(pjsip:${EXTEN},${MESSAGE(from)})
 same => n,NoOp(Statut d'envoi : ${MESSAGE_SEND_STATUS})
 same => n,Hangup()

[from-internal]
exten => 100,1,Answer()
same => n,Wait(1)
same => n,Playback(hello-world)
same => n,Echo()
same => n,Hangup()


exten => _XXX,1,Dial(PJSIP/${EXTEN})
same => n,Hangup()

; ===== Tests du gestionnaire d appels =====
; 8400 : appelle l appli (400) en numero MASQUE
exten => 8400,1,Set(CALLERID(num)=anonymous)
 same => n,Set(CALLERID(name)=Anonymous)
 same => n,Dial(PJSIP/400)
 same => n,Hangup()

; 9400 : appelle l appli depuis un numero de DEMARCHAGE
exten => 9400,1,Set(CALLERID(num)=0162123456)
 same => n,Dial(PJSIP/400)
 same => n,Hangup()

; Annonce pour les numeros masques (= annonceMasque du moteur)
exten => annonce-masque,1,Answer()
 same => n,Wait(1)
 same => n,Playback(custom/annonce-masque)
 same => n,Hangup()

; *77 : enregistrer l annonce des numeros masques (bip, parler, puis # ou 3 s de silence)
exten => *77,1,Answer()
 same => n,Wait(1)
 same => n,Record(custom/annonce-masque.wav,3,30,k)
 same => n,Wait(1)
 same => n,Playback(custom/annonce-masque)
 same => n,Hangup()
